[project]
name = "takaro-maint"
version = "0.1.0"
description = "Catalog-driven maintenance command for the Takaro game connectors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43,<1.44",
    "jsonschema>=4.23,<5",
    # Exact pin: lossless WebP bytes depend on the Pillow wheel and the libwebp bundled in it. Bumping
    # it changes object hashes (objects are content-addressed, so the rolling merge repoints codes);
    # do that deliberately, never as a drive-by dependency update.
    "pillow==13.0.0",
    "referencing>=0.35,<1",
    "websockets>=15,<16",
]

[project.scripts]
takaro-maint = "takaro_maint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<0.15",
    "mypy>=1.14,<2",
    "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takaro_maint"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
