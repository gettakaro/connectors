name: enshrouded-takaro
services:
  # The exact server the Takaro plugin is built for. The image is pinned by tag AND digest
  # and must stay equal to catalog/enshrouded/targets/proton-1024233.json (a test asserts
  # it): a newer image would carry a different Proton, and a newer game build would move
  # the code the plugin hooks by signature.
  #
  # The game files under ./data/enshrouded/server come from
  #   maintenance/bin/takaro-maint install --game enshrouded --dest ./data/enshrouded/server
  # which downloads exactly the pinned depot manifests, and NOT from the image's SteamCMD.
  # ./server/enshrouded-updater (tracked next to this file) replaces the image's updater
  # program, which would otherwise compare the installed build against the branch head at
  # every container start and update over it. There is deliberately no UPDATE_CRON,
  # RESTART_CRON, GAME_BRANCH or STEAMCMD_ARGS here.
  enshrouded:
    image: mornedhels/enshrouded-server:1.7.2-proton@sha256:85978a10f88a85ab0a0aa92e9821d30424895d38bf81fe543532451219c42d0d
    container_name: enshrouded-server
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "15637:15637/udp"
    environment:
      SERVER_NAME: My Enshrouded Server
      SERVER_SLOT_COUNT: "16"
      PUID: "1000"
      PGID: "1000"
      SERVER_ROLE_0_NAME: Admins
      SERVER_ROLE_0_PASSWORD: "${ENSHROUDED_ADMIN_PASSWORD:?required}"
      SERVER_ROLE_0_CAN_KICK_BAN: "true"
      SERVER_ROLE_0_CAN_ACCESS_INVENTORIES: "true"
      SERVER_ROLE_0_CAN_EDIT_WORLD: "true"
      SERVER_ROLE_0_CAN_EDIT_BASE: "true"
      SERVER_ROLE_0_CAN_EXTEND_BASE: "true"
      SERVER_ROLE_1_NAME: Friends
      SERVER_ROLE_1_PASSWORD: "${ENSHROUDED_PLAYER_PASSWORD:?required}"
      SERVER_ROLE_1_CAN_ACCESS_INVENTORIES: "true"
      SERVER_ROLE_1_CAN_EDIT_WORLD: "true"
      SERVER_ROLE_1_CAN_EDIT_BASE: "true"
      SERVER_ROLE_1_CAN_EXTEND_BASE: "true"
      SERVER_ROLE_2_NAME: Guests
      SERVER_ROLE_2_PASSWORD: "${ENSHROUDED_GUEST_PASSWORD:?required}"
      BACKUP_CRON: "0 * * * *"
      BACKUP_MAX_COUNT: "24"
      TZ: Europe/Brussels
      WINEDLLOVERRIDES: "dbghelp=n,b"
      # The Takaro connection lives in dbghelp.dll. These win over takaro/plugin.json; leave
      # them out and fill in data/enshrouded/server/takaro/plugin.json instead if you prefer.
      TAKARO_WS_URL: "${TAKARO_WS_URL:-wss://connect.takaro.io/}"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_ENSHROUDED:-my-enshrouded-server}"
      TAKARO_REGISTRATION_TOKEN: "${TAKARO_REGISTRATION_TOKEN:?required}"
      TAKARO_SERVER_NAME: "My Enshrouded Server"
      # Optional: a secret for the plugin's diagnostics at 127.0.0.1:18890/health.
      TAKARO_PLUGIN_TOKEN: "${TAKARO_ENSHROUDED_PLUGIN_TOKEN:-}"
    volumes:
      # `create_host_path: false` on both: lay the tree down first (README, "Copy it into
      # place" -- `mkdir -p data/enshrouded/server/takaro/plugin` and copy the DLL there). Without
      # it compose would create a DIRECTORY named dbghelp.dll and the server would boot
      # with no plugin loaded; with it compose stops at "bind source path does not exist".
      - type: bind
        source: ./data/enshrouded/server
        target: /opt/enshrouded/server
        bind:
          create_host_path: false
      # Takaro plugin (dbghelp.dll proxy), mounted read-only so nothing inside the
      # container can replace it.
      - type: bind
        source: ./data/enshrouded/server/takaro/plugin/dbghelp.dll
        target: /opt/enshrouded/server/dbghelp.dll
        read_only: true
        bind:
          create_host_path: false
      # No boot of this server ever runs SteamCMD.
      - ./server/enshrouded-updater:/usr/local/etc/enshrouded/enshrouded-updater:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
