# Takaro VEIN connector settings. This file goes in the same folder as libtakaro-vein.so
# (normally Vein/Binaries/Linux, next to libsteam.so).
# One KEY=VALUE per line. Environment variables with the same name take precedence.

# Paste the registration token from the Takaro dashboard here and save. This works before or
# after the server starts: the connector picks the change up within a few seconds, no restart.
TAKARO_REGISTRATION_TOKEN=

# Leave empty; the connector fills it in. It identifies this server in Takaro, so keep it if
# you move or reinstall the server.
TAKARO_IDENTITY_TOKEN=

# The name Takaro gives this server when it registers, and the name in front of Takaro's chat messages.
TAKARO_SERVER_NAME=My VEIN server

# Optional: SteamID64s that get VEIN's in-game admin rights, comma separated.
# TAKARO_ADMIN_STEAMIDS=

# Optional: where the connector keeps its state (bans, event queue, a saved copy of the token
# and identity). Must be writable and kept across restarts and updates.
# Default: Vein/Binaries/Linux/takaro next to the server.
# TAKARO_PLUGIN_DATA_DIR=
