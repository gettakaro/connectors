; Copy to ModLoader/Plugins/config/TakaroStarRupture.ini and fill in RegistrationToken.
[General]
Enabled=1

[Takaro]
; The registration token from your Takaro game server settings.
RegistrationToken=
; The name this server gets in Takaro.
ServerName=
; Filled in by the plugin on first start. Keep it: it ties this server to its Takaro entry.
IdentityToken=
; Leave as is unless your Takaro team gave you another address.
WsUrl=wss://connect.takaro.io/
