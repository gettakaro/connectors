// Takaro TF2 SourceMod connector example config.
// Copy to tf/cfg/sourcemod/takaro_tf2.cfg and set real values on the server.

takaro_tf2_ws_url "wss://connect.takaro.io"
takaro_tf2_server_name "TF2 Dedicated Server"

// Set a stable per-server identity token and the domain registration token at deploy time.
// Do not commit real tokens.
takaro_tf2_identity_token ""
takaro_tf2_registration_token ""

takaro_tf2_include_bots "0"
takaro_tf2_reconnect_min_ms "1000"
takaro_tf2_reconnect_max_ms "30000"

// Semicolon-separated allowlists. Exact command defaults to status.
takaro_tf2_command_allowlist_exact "status"
takaro_tf2_command_allowlist_prefixes ""

// Disabled by default. When enabled, Takaro shutdown maps to the server quit command.
takaro_tf2_shutdown_enabled "0"
