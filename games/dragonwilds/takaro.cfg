# Takaro RuneScape: Dragonwilds connector settings. This file goes in the same folder as
# libtakaro-dragonwilds.so. One KEY=VALUE per line. An environment variable with the same name
# (for example from a Docker .env) takes precedence over the line here.

# Paste the registration token from the Takaro dashboard here and save. This works before or
# after the server starts: the connector picks the change up within a few seconds, no restart.
TAKARO_REGISTRATION_TOKEN=

# Leave empty; the connector fills it in. It identifies this server in Takaro, so keep it if
# you move or reinstall the server.
TAKARO_IDENTITY_TOKEN=

# The name Takaro gives this server when it registers. Names are unique in a Takaro domain;
# left empty, it is "Dragonwilds (<first 8 characters of the identity>)".
TAKARO_SERVER_NAME=

# Where the connector keeps its state (event queue, players, timed bans and a saved copy of the
# token and identity). Must be writable and kept across restarts and upgrades.
# Default: RSDragonwilds/Binaries/Linux/takaro next to the server binary.
# TAKARO_STATE_DIR=

# The server log the connector reads chat, joins and kills from. Default: found from the binary.
# DRAGONWILDS_LOG_FILE=
