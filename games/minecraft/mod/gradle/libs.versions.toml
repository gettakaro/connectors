[versions]
# Game-coupled coordinates (Minecraft, the Fabric loader/API, the Paper API and the NeoForge
# version) live in catalog/minecraft/targets/*.json, not here: they change per target and only
# through a catalog PR. Only the build tooling below is pinned in this file.

java-websocket = "1.6.0"
gson = "2.14.0"
log4j = "2.26.0"

shadow = "9.4.2"
fabric-loom = "1.17.20"
neoforge-moddev = "2.0.141"

[libraries]
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
