# Takaro connector settings. Saving this file is enough: the connector picks up
# changes within a few seconds, no restart needed.
takaro:
  websocket:
    url: "wss://connect.takaro.io/"
  authentication:
    # Filled in by the connector on first start. Keep it; it is how Takaro knows this server.
    identity_token: ""
    # Paste the registration token from Takaro here.
    registration_token: ""
  reconnect:
    enabled: true
    delay: 1000
    max_delay: 60000
    backoff_multiplier: 2.0
  debug: false
  # World map in Takaro. Needs a Takaro that speaks protocol v1.
  map: false
  # Sender name on Takaro's messages when Takaro sends none. Empty = no sender name.
  server_chat_name: ""
