## Takaro Valheim connector settings.
##
## Paste the registration token Takaro shows when you add a Generic game server into
## registrationToken and save. This works before or after the server starts: the connector
## checks this file every few seconds and connects as soon as a token is saved, no restart
## needed.
##
## Leave identityToken empty; the connector fills it in. It identifies this server in Takaro.
## The connector also keeps the token and identity in BepInEx/config/com.takaro.valheim.cfg,
## so replacing this folder on an upgrade keeps them.

[Takaro]

## Apart from the two tokens, the settings are commented out and use their defaults. To change
## one, remove the leading "# " and edit the value; a setting written here always wins.

## Takaro registration token.
registrationToken =

## The server name shown in Takaro; must be unique in your Takaro domain. Unset, the
## connector uses the server's own name plus the start of its identity.
# serverName = Valheim Server

## Identifies this server in Takaro. Filled in by the connector; leave it empty.
identityToken =

## Takaro connector WebSocket URL; keep the default.
# takaroWsUrl = wss://connect.takaro.io/

## Connector log level.
# logLevel = Information

## Forward connector log events to Takaro.
# enableLogEvents = true

## Semicolon-separated exact console commands allowed for executeConsoleCommand.
# commandAllowlistExact = help

## Semicolon-separated console command prefixes allowed for executeConsoleCommand.
# commandAllowlistPrefixes =

## Name shown in game chat for Takaro messages (unless Takaro sends its own sender name).
# chatSenderName = Takaro
