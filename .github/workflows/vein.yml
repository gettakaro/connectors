name: VEIN Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/vein/**'
      - 'catalog/vein/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/vein.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/vein/**'
      - 'catalog/vein/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/vein.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.1.0)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. vein-v0.1.0)
        required: true
        type: string

concurrency:
  group: vein-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds. Not gated on `!inputs.tag`: `release`
          # needs it, and a skipped dependency would skip the release with it.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Build the plugin and run its unit tests (debian:bookworm toolchain)
        run: |
          chmod +x games/vein/mod/build.sh games/vein/mod/tests/*.sh
          games/vein/mod/build.sh --tests
      - name: Test operator smoke and drain tools
        run: python3 -m unittest discover -s games/vein/scripts -p 'test_*.py' -v

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh vein >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: vein
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The VEIN dedicated server is a ~9.7 GB Steam depot and the plugin loads with
      # LD_PRELOAD onto a game binary that has no hosted-runner image, so the release
      # claims contract verification (the tests above and the release build) and runtime
      # proof stays on the dev rig with a real client.
      runtime: false
