name: VEIN Connector

on:
  push:
    branches: [main]
    paths: ['games/vein/**', 'scripts/**', '.github/workflows/vein.yml']
  pull_request:
    paths: ['games/vein/**', 'scripts/**', '.github/workflows/vein.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.1.0)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. vein-v0.1.0)
        required: true
        type: string

concurrency:
  group: vein-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/vein/sidecar/package-lock.json
      - name: Install sidecar dependencies
        working-directory: games/vein/sidecar
        run: npm ci
      - name: Typecheck sidecar
        working-directory: games/vein/sidecar
        run: npm run typecheck
      - name: Test sidecar
        working-directory: games/vein/sidecar
        run: npm test
      - name: Test runtime smoke gate
        run: python3 -m unittest discover -s games/vein/scripts -p test_smoke_server.py
      - name: Build the plugin and run its unit tests (debian:bookworm toolchain)
        run: |
          chmod +x games/vein/mod/build.sh games/vein/mod/tests/run.sh
          docker run --rm -v "$PWD/games/vein/mod":/src -w /src \
            debian:bookworm bash -c 'apt-get update -qq && apt-get install -y -qq build-essential >/dev/null && ./build.sh --native --tests'
          sudo chown -R "$(id -u):$(id -g)" games/vein/mod

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      # The tag, the version, the manifest and the checked-out commit must all agree
      # before anything is built.
      - name: Release guard
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
        run: scripts/release-guard.sh vein "$IN_VERSION" "$IN_TAG"

      - name: Generate token
        id: app-token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/vein/sidecar/package-lock.json

      - name: Make scripts executable
        run: chmod +x games/vein/scripts/*.sh games/vein/mod/*.sh games/vein/mod/tests/*.sh scripts/*.sh

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh vein >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: games/vein/scripts/build-release.sh "${{ steps.params.outputs.version }}" "$RUNNER_TEMP/dist"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # One publisher for every connector: the set is assembled, published and read
      # back from GitHub. `--mode legacy` means the files are named here rather than
      # derived from a catalog, so this connector's asset names are unchanged.
      # Fork PRs get a read-only token, so they build for validation only.
      - name: Publish
        if: ${{ steps.params.outputs.publish != 'none' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          scripts/publish-release.sh publish \
            --connector vein \
            --channel "${{ steps.params.outputs.publish }}" \
            --version "${{ steps.params.outputs.version }}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --mode legacy \
            --dist "$RUNNER_TEMP/dist" \
            --out "$RUNNER_TEMP/assembled" \
            -- \
            "$RUNNER_TEMP/dist/takaro-vein-plugin.tar.gz" \
            "$RUNNER_TEMP/dist/takaro-vein-sidecar.tar.gz"

      - name: Comment PR build
        if: ${{ steps.params.outputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/comment-pr-build.sh vein \
            "${{ github.event.pull_request.number }}" \
            "${{ steps.params.outputs.tag }}" \
            "${{ steps.params.outputs.version }}" \
            "$RUNNER_TEMP/assembled"
