name: 7D2D Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/7d2d/**'
      - 'catalog/7d2d/**'
      - 'maintenance/**'
      - 'tests/test_7d2d_connector_regressions.py'
      - 'scripts/**'
      - '.github/workflows/7d2d.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/7d2d/**'
      - 'catalog/7d2d/**'
      - 'maintenance/**'
      - 'tests/test_7d2d_connector_regressions.py'
      - 'scripts/**'
      - '.github/workflows/7d2d.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. 7d2d-v0.1.6)
        required: true
        type: string

# Serialize same-ref runs so consecutive main pushes don't race on the rolling
# 7d2d-dev release. A release or recovery run has the tag in its key, so a push to main
# queues behind it instead of cancelling it; only ordinary CI runs are cancelled.
concurrency:
  group: 7d2d-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  codestyle:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/7d2d/mod
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      - name: Install CSharpier
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier --check . ../tests

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources and catalog, never on whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # Every target the release builds: V3.3.0 and later compile a different code path
      # (scripts/lib-target.sh sevend2d_api_defines), so each one is checked on its own
      # reference assemblies.
      - name: Resolve the targets
        id: targets
        run: |
          maintenance/bin/takaro-maint targets list \
            --game 7d2d \
            --status candidate,maintained \
            --format gha >> "$GITHUB_OUTPUT"

      # Keyed on the target records: a re-pinned or added target fetches its own assemblies
      # rather than compiling against another build's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            games/7d2d/_data/7dtd-binaries
            ~/.cache/takaro-maint
          key: 7d2d-refs-${{ hashFiles('catalog/7d2d/targets/*.json') }}

      # The reference assemblies only — a filelist against the pinned depot manifests,
      # not the 17 GB depot a hosted runner has no room for.
      - name: Fetch the references and run the contract harness per target
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          for target in $(jq -r '.[].id' <<<"$TARGETS"); do
            echo "::group::${target}"
            games/7d2d/scripts/setup-environment.sh --target "${target}"
            games/7d2d/scripts/test-contract.sh --target "${target}"
            echo "::endgroup::"
          done

      - name: Run source regressions
        run: python3 -m unittest tests/test_7d2d_connector_regressions.py

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh 7d2d >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: 7d2d
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The 7D2D dedicated server is a 17.6 GB Steam depot set: a hosted runner cannot
      # install or boot it, so the release claims contract verification only. Runtime
      # onboarding for this connector is tracked separately.
      runtime: false
