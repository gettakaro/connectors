name: ARK Native Connector

on:
  push:
    branches: [main]
    paths: ['games/ark/**', 'catalog/ark/**', 'maintenance/**', 'scripts/**', '.github/workflows/ark.yml']
  pull_request:
    paths: ['games/ark/**', 'catalog/ark/**', 'maintenance/**', 'scripts/**', '.github/workflows/ark.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Connector version to build
        required: true
        type: string
      tag:
        description: Existing release tag for recovery
        required: true
        type: string

concurrency:
  group: ark-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Native contract tests in pinned toolchain
        run: |
          docker run --rm --network none -v "$PWD/games/ark/mod:/work" -w /work \
            node:22.23.2-bookworm@sha256:dd5847a04b0deee391fa145f1f4c6d214196668b6bcc7988ebed67249f226844 \
            bash -lc 'set -euo pipefail; for source in tests/*_test.cpp; do
              name=${source##*/}; name=${name%.cpp}
              g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread "$source" -o "/tmp/$name"
              "/tmp/$name"
            done'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: games/ark/sidecar/package-lock.json
      - name: Sidecar contract
        working-directory: games/ark/sidecar
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh ark >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: ark
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The Steam depot is 23 GB; hosted CI tests the native/Generic contract.
      # Live compatibility remains a separate exact-build rig gate.
      runtime: false
