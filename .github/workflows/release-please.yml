name: Release Please

on:
  push:
    branches: [main]

# A push to main while a release is being published must queue, never cancel it: the release
# jobs below create the draft, the tag and the assets, and a half-finished one is a release
# nobody can finish by hand.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      ark_released: ${{ steps.rp.outputs['games/ark--release_created'] }}
      ark_tag: ${{ steps.rp.outputs['games/ark--tag_name'] }}
      ark_version: ${{ steps.rp.outputs['games/ark--version'] }}
      rust_released: ${{ steps.rp.outputs['games/rust--release_created'] }}
      rust_tag: ${{ steps.rp.outputs['games/rust--tag_name'] }}
      rust_version: ${{ steps.rp.outputs['games/rust--version'] }}
      minecraft_released: ${{ steps.rp.outputs['games/minecraft--release_created'] }}
      minecraft_tag: ${{ steps.rp.outputs['games/minecraft--tag_name'] }}
      minecraft_version: ${{ steps.rp.outputs['games/minecraft--version'] }}
      sevend2d_released: ${{ steps.rp.outputs['games/7d2d--release_created'] }}
      sevend2d_tag: ${{ steps.rp.outputs['games/7d2d--tag_name'] }}
      sevend2d_version: ${{ steps.rp.outputs['games/7d2d--version'] }}
      zomboid_released: ${{ steps.rp.outputs['games/zomboid--release_created'] }}
      zomboid_tag: ${{ steps.rp.outputs['games/zomboid--tag_name'] }}
      zomboid_version: ${{ steps.rp.outputs['games/zomboid--version'] }}
      valheim_released: ${{ steps.rp.outputs['games/valheim--release_created'] }}
      valheim_tag: ${{ steps.rp.outputs['games/valheim--tag_name'] }}
      valheim_version: ${{ steps.rp.outputs['games/valheim--version'] }}
      conan_exiles_released: ${{ steps.rp.outputs['games/conan-exiles--release_created'] }}
      conan_exiles_tag: ${{ steps.rp.outputs['games/conan-exiles--tag_name'] }}
      conan_exiles_version: ${{ steps.rp.outputs['games/conan-exiles--version'] }}
      terraria_released: ${{ steps.rp.outputs['games/terraria--release_created'] }}
      terraria_tag: ${{ steps.rp.outputs['games/terraria--tag_name'] }}
      terraria_version: ${{ steps.rp.outputs['games/terraria--version'] }}
      dragonwilds_released: ${{ steps.rp.outputs['games/dragonwilds--release_created'] }}
      dragonwilds_tag: ${{ steps.rp.outputs['games/dragonwilds--tag_name'] }}
      dragonwilds_version: ${{ steps.rp.outputs['games/dragonwilds--version'] }}
      enshrouded_released: ${{ steps.rp.outputs['games/enshrouded--release_created'] }}
      enshrouded_tag: ${{ steps.rp.outputs['games/enshrouded--tag_name'] }}
      enshrouded_version: ${{ steps.rp.outputs['games/enshrouded--version'] }}
      dune_released: ${{ steps.rp.outputs['games/dune--release_created'] }}
      dune_tag: ${{ steps.rp.outputs['games/dune--tag_name'] }}
      dune_version: ${{ steps.rp.outputs['games/dune--version'] }}
      vein_released: ${{ steps.rp.outputs['games/vein--release_created'] }}
      vein_tag: ${{ steps.rp.outputs['games/vein--tag_name'] }}
      vein_version: ${{ steps.rp.outputs['games/vein--version'] }}
    steps:
      # Author Release PRs as takaro-ci-bot[bot] instead of GITHUB_TOKEN. PRs/commits made
      # with GITHUB_TOKEN don't fire downstream events, so the required `conventional-title`
      # check never ran on Release PRs and they couldn't merge. An App token triggers it.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a connector's Release PR is merged, release-please creates its tag + GitHub
  # Release; these jobs build the artifacts and attach them to that release in the
  # same run (no cross-workflow tag trigger needed — sidesteps the GITHUB_TOKEN trap).
  release-ark:
    needs: release-please
    if: ${{ needs.release-please.outputs.ark_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ark.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.ark_version }}
      tag: ${{ needs.release-please.outputs.ark_tag }}

  release-rust:
    needs: release-please
    if: ${{ needs.release-please.outputs.rust_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/rust.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.rust_version }}
      tag: ${{ needs.release-please.outputs.rust_tag }}

  release-minecraft:
    needs: release-please
    if: ${{ needs.release-please.outputs.minecraft_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/minecraft.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.minecraft_version }}
      tag: ${{ needs.release-please.outputs.minecraft_tag }}

  release-7d2d:
    needs: release-please
    if: ${{ needs.release-please.outputs.sevend2d_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/7d2d.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.sevend2d_version }}
      tag: ${{ needs.release-please.outputs.sevend2d_tag }}

  release-zomboid:
    needs: release-please
    if: ${{ needs.release-please.outputs.zomboid_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/zomboid.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.zomboid_version }}
      tag: ${{ needs.release-please.outputs.zomboid_tag }}

  release-valheim:
    needs: release-please
    if: ${{ needs.release-please.outputs.valheim_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/valheim.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.valheim_version }}
      tag: ${{ needs.release-please.outputs.valheim_tag }}

  release-conan-exiles:
    needs: release-please
    if: ${{ needs.release-please.outputs.conan_exiles_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/conan-exiles.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.conan_exiles_version }}
      tag: ${{ needs.release-please.outputs.conan_exiles_tag }}

  release-terraria:
    needs: release-please
    if: ${{ needs.release-please.outputs.terraria_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/terraria.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.terraria_version }}
      tag: ${{ needs.release-please.outputs.terraria_tag }}

  release-enshrouded:
    needs: release-please
    if: ${{ needs.release-please.outputs.enshrouded_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/enshrouded.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.enshrouded_version }}
      tag: ${{ needs.release-please.outputs.enshrouded_tag }}

  release-dragonwilds:
    needs: release-please
    if: ${{ needs.release-please.outputs.dragonwilds_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dragonwilds.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.dragonwilds_version }}
      tag: ${{ needs.release-please.outputs.dragonwilds_tag }}

  release-dune:
    needs: release-please
    if: ${{ needs.release-please.outputs.dune_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dune.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.dune_version }}
      tag: ${{ needs.release-please.outputs.dune_tag }}

  release-vein:
    needs: release-please
    if: ${{ needs.release-please.outputs.vein_released == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/vein.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.vein_version }}
      tag: ${{ needs.release-please.outputs.vein_tag }}

  # takaro.io/connectors serves downloads from a committed snapshot of this repo's
  # releases, so the website only learns about a release when we tell it. This dispatch
  # opens a refresh PR there (gettakaro/static-sites, .github/workflows/connectors-refresh.yml).
  #
  # `always()` so one game's failed build does not silence the games that did ship; the
  # per-game guards keep it to runs that actually published something.
  notify-website:
    needs:
      - release-please
      - release-ark
      - release-rust
      - release-minecraft
      - release-7d2d
      - release-zomboid
      - release-valheim
      - release-conan-exiles
      - release-terraria
      - release-enshrouded
      - release-dragonwilds
      - release-vein
    if: |
      always() && (
        (needs.release-ark.result == 'success' && needs.release-please.outputs.ark_released == 'true') ||
        (needs.release-rust.result == 'success' && needs.release-please.outputs.rust_released == 'true') ||
        (needs.release-minecraft.result == 'success' && needs.release-please.outputs.minecraft_released == 'true') ||
        (needs.release-7d2d.result == 'success' && needs.release-please.outputs.sevend2d_released == 'true') ||
        (needs.release-zomboid.result == 'success' && needs.release-please.outputs.zomboid_released == 'true') ||
        (needs.release-valheim.result == 'success' && needs.release-please.outputs.valheim_released == 'true') ||
        (needs.release-conan-exiles.result == 'success' && needs.release-please.outputs.conan_exiles_released == 'true') ||
        (needs.release-terraria.result == 'success' && needs.release-please.outputs.terraria_released == 'true') ||
        (needs.release-enshrouded.result == 'success' && needs.release-please.outputs.enshrouded_released == 'true') ||
        (needs.release-dragonwilds.result == 'success' && needs.release-please.outputs.dragonwilds_released == 'true') ||
        (needs.release-vein.result == 'success' && needs.release-please.outputs.vein_released == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}
          owner: gettakaro
          repositories: static-sites

      # One dispatch per run, carrying whichever tag released. The receiver reseeds every
      # game regardless; the tag only titles the refresh PR.
      - name: Dispatch the website refresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: >-
            ${{ needs.release-please.outputs.ark_tag
             || needs.release-please.outputs.rust_tag
             || needs.release-please.outputs.minecraft_tag
             || needs.release-please.outputs.sevend2d_tag
             || needs.release-please.outputs.zomboid_tag
             || needs.release-please.outputs.valheim_tag
             || needs.release-please.outputs.conan_exiles_tag
             || needs.release-please.outputs.terraria_tag
             || needs.release-please.outputs.enshrouded_tag
             || needs.release-please.outputs.dragonwilds_tag
             || needs.release-please.outputs.vein_tag }}
        run: |
          gh api repos/gettakaro/static-sites/dispatches \
            -f event_type=connector-released \
            -f "client_payload[tag]=$TAG"
