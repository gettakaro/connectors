name: "Dune: Awakening Connector"

on:
  push:
    branches: [main]
    paths:
      - 'games/dune/**'
      - 'catalog/dune/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/dune.yml'
      - 'dev-servers/lib/games/dune.sh'
      - 'tests/test_dune_db_migration.sh'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/dune/**'
      - 'catalog/dune/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/dune.yml'
      - 'dev-servers/lib/games/dune.sh'
      - 'tests/test_dune_db_migration.sh'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.1.0)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. dune-v0.1.0)
        required: true
        type: string

concurrency:
  group: dune-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources and catalog, never on whatever main has become.
          # The job is not gated on `!inputs.tag` -- `release` needs it, and a skipped
          # dependency would skip the release with it.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/dune/sidecar/package-lock.json
      - name: Install sidecar dependencies
        working-directory: games/dune/sidecar
        run: npm ci
      # The contract check lives here: the real sidecar against a mock battlegroup
      # (RabbitMQ, Postgres, the GM command bus and the plugin's loopback API), so a
      # hosted runner proves the protocol without a 4.9 GB package and a Funcom token.
      - name: Typecheck sidecar
        working-directory: games/dune/sidecar
        run: npm run typecheck
      - name: Test sidecar
        working-directory: games/dune/sidecar
        run: npm test
      - name: Build the plugin and run its unit tests
        run: |
          chmod +x games/dune/mod/build.sh games/dune/mod/tests/run.sh
          games/dune/mod/build.sh --tests
      - name: Test the rig's database migration
        run: bash tests/test_dune_db_migration.sh

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh dune >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: dune
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The Dune server is a 4.9 GB Steam package that unpacks into a 10.8 GB container
      # image, and a world only becomes joinable with an operator's own Funcom
      # self-hosting token — there is no anonymous boot. A hosted runner can do neither,
      # so the release claims contract verification (the sidecar's own end-to-end tests
      # and the plugin's unit tests) and every runtime level is proven on the rig against
      # this exact pin instead.
      runtime: false
