name: Terraria Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/terraria/**'
      - 'catalog/terraria/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/terraria.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/terraria/**'
      - 'catalog/terraria/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/terraria.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. terraria-v0.2.2)
        required: true
        type: string

# Serialize same-ref runs. A release or recovery run has the tag in its key, so a push to
# main queues behind it instead of cancelling it; only ordinary CI runs are cancelled.
concurrency:
  group: terraria-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  # The bridge's own protocol tests are this connector's contract evidence, so they run on
  # a release too, not only on a pull request.
  bridge-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: games/terraria/bridge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources, never on whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/terraria/bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh terraria >> "$GITHUB_OUTPUT"

  release:
    needs: [bridge-test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: terraria
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The verify leg boots the pinned TShock image with the built plugin, starts the built
      # bridge as a second container in its network namespace, and runs `takaro-maint verify
      # --game terraria` against a local fake Takaro. The first boot generates a small world,
      # so the server gets the game's own 900 s budget instead of the default 600 s.
      runtime: true
      startup_timeout: 900
