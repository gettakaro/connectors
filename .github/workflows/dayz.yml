name: DayZ Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/dayz/**'
      - 'catalog/dayz/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/dayz.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/dayz/**'
      - 'catalog/dayz/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/dayz.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.1.0)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. dayz-v0.1.0)
        required: true
        type: string

concurrency:
  group: dayz-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources, never on whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # The contract check: the sidecar's suite (`npm test`: tsc, then node:test over the
      # protocol v1 handshake, the map service and the poll watchdog) and the PBO packer's
      # unit tests, inside the target's pinned Node image.
      - name: Unit tests
        run: games/dayz/scripts/test.sh

  params:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh dayz >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: dayz
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The DayZ server depots (Steam app 223350) are served only to a Steam account that
      # owns DayZ; the anonymous login a hosted runner has is refused. No runner can install
      # or boot the server, so the release claims contract verification (the tests above and
      # the reproducible build) and runtime proof comes from a real server with a real client.
      runtime: false
