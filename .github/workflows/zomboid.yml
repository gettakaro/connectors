name: Project Zomboid Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/zomboid/**'
      - 'catalog/zomboid/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/zomboid.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/zomboid/**'
      - 'catalog/zomboid/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/zomboid.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.1)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. zomboid-v1.0.1)
        required: true
        type: string

# Serialize same-ref runs so consecutive main pushes don't race on the rolling
# zomboid-dev release. Release runs (caller's workflow name) are in a different group.
concurrency:
  group: zomboid-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources and catalog, never on whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      - name: Resolve the target
        id: target
        run: |
          maintenance/bin/takaro-maint targets resolve \
            --game zomboid \
            --format gha >> "$GITHUB_OUTPUT"

      # Keyed on the fingerprint: a re-pinned target fetches its own server jar rather
      # than compiling against the previous build's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            games/zomboid/_data/references
            ~/.cache/takaro-maint
          key: zomboid-refs-${{ steps.target.outputs.fp16 }}

      # The server jar only — a filelist against the pinned depot manifests, not the
      # 7.2 GB depot set a hosted runner has no room for.
      - name: Fetch the pinned server jar
        run: games/zomboid/scripts/setup-environment.sh --target "${{ steps.target.outputs.target }}"

      - name: Run the core and agent JUnit suites
        run: games/zomboid/scripts/test.sh --target "${{ steps.target.outputs.target }}"

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh zomboid >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: zomboid
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The pinned server boots on the hosted runner with the built agent attached, against
      # the local fake Takaro (`takaro-maint verify --game zomboid`, see
      # games/zomboid/DEVELOPMENT.md). The three depots (7.2 GB on disk, 2 GB compressed)
      # are cached by the verify leg alone, never installed twice.
      runtime: true
      runtime_depot_cache: true
      startup_timeout: 900
