name: Dragonwilds Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/dragonwilds/**'
      - 'catalog/dragonwilds/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/dragonwilds.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/dragonwilds/**'
      - 'catalog/dragonwilds/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/dragonwilds.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.1.0)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. dragonwilds-v0.1.0)
        required: true
        type: string

concurrency:
  group: dragonwilds-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources and catalog, never on whatever main has become.
          # The job is not gated on `!inputs.tag` -- `release` needs it, and a skipped
          # dependency would skip the release with it.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/dragonwilds/sidecar/package-lock.json
      - name: Install sidecar dependencies
        working-directory: games/dragonwilds/sidecar
        run: npm ci
      # The contract check lives here: the real sidecar's own unit tests, so a hosted
      # runner proves the protocol without a 5.4 GB game and a Steam-owned world.
      - name: Typecheck sidecar
        working-directory: games/dragonwilds/sidecar
        run: npm run typecheck
      - name: Test sidecar
        working-directory: games/dragonwilds/sidecar
        run: npm test
      - name: Build the plugin and run its unit tests (debian:bookworm toolchain)
        run: |
          chmod +x games/dragonwilds/mod/build.sh games/dragonwilds/mod/tests/run.sh
          docker run --rm -v "$PWD/games/dragonwilds/mod":/src -w /src \
            debian:bookworm bash -c 'apt-get update -qq && apt-get install -y -qq build-essential >/dev/null && ./build.sh --native --tests'
          sudo chown -R "$(id -u):$(id -g)" games/dragonwilds/mod

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh dragonwilds >> "$GITHUB_OUTPUT"

  release:
    needs: [test, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: dragonwilds
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The Dragonwilds dedicated server is a 5.4 GB Steam depot, and the plugin loads
      # with LD_PRELOAD onto a game binary this repository has no runtime image for yet
      # (the operator supplies their own) -- a hosted runner can do neither, so the
      # release claims contract verification (the sidecar's own tests and the plugin's
      # unit tests, both run above on every build) and runtime onboarding is tracked
      # separately, the same posture Dune: Awakening and Conan Exiles both took at this
      # stage.
      runtime: false
