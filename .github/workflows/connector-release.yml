name: Connector Release

# Build and publish one connector's artifacts, one job per catalog target.
# Callers keep their own concurrency group; nothing is set here.
on:
  workflow_call:
    inputs:
      connector:
        description: Catalog game id, e.g. minecraft
        required: true
        type: string
      version:
        description: Version to stamp into the artifacts
        required: true
        type: string
      tag:
        description: Release tag to publish to (empty when nothing is published)
        required: false
        default: ''
        type: string
      publish:
        description: stable | rolling | pr | none
        required: true
        type: string
      pr_number:
        description: Pull request number, for pr builds
        required: false
        default: ''
        type: string
      legacy_build:
        description: Optional script that builds the not-yet-migrated modules
        required: false
        default: ''
        type: string
      runtime:
        description: Install the pinned server and boot it on the hosted runner; false for a game whose server cannot run there yet
        required: false
        default: true
        type: boolean

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Stable releases build the tag; everything else builds the exact commit that started the run,
          # never a branch tip that may have moved while earlier jobs ran.
          ref: ${{ inputs.publish == 'stable' && inputs.tag || github.sha }}
          # A pull request's github.sha is its merge commit; its first parent is the base.
          fetch-depth: 2
          fetch-tags: true

      # A pull request builds this connector only when it changes something the build reads.
      # Otherwise the build would repeat main's and could only fail for an unrelated reason,
      # such as Steam no longer serving a pinned depot manifest after the game updated. Every
      # other trigger always builds, so main still catches that stale pin.
      - name: Does this pull request change this connector's build inputs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decision="$(git diff --name-only HEAD^1 HEAD | scripts/pr-build-scope.sh "$IN_CONNECTOR")"
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "build=false" ]; then
            echo "::notice::$IN_CONNECTOR release build skipped: this pull request changes none of its build inputs (see scripts/pr-build-scope.sh)"
          fi

      # Before anything is built: the tag, the version, the manifest and the checked-out
      # commit all have to agree, or this run would attach one version's artifacts to another
      # version's release.
      - name: Release guard
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.publish == 'stable' && inputs.tag || '' }}
        run: scripts/release-guard.sh "$IN_CONNECTOR" "$IN_VERSION" "$IN_TAG"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      - name: Resolve the build matrix from the catalog
        id: targets
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          maintenance/bin/takaro-maint targets list \
            --game "$IN_CONNECTOR" \
            --status candidate,maintained \
            --format gha >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.publish == 'stable' && inputs.tag || github.sha }}
          fetch-tags: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      - name: Resolve the target
        id: target
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          maintenance/bin/takaro-maint targets resolve \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            --format gha >> "$GITHUB_OUTPUT"

      # Keyed on the fingerprint: a different target, or the same target with a changed
      # input, never reuses another target's downloads or Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/takaro-maint
            ~/.cache/takaro-maint/gradle
          key: ${{ inputs.connector }}-${{ steps.target.outputs.fp16 }}

      # A server the hosted runner cannot hold (tens of gigabytes of Steam depots) is not
      # installed here; that connector builds against references tracked in the repository.
      - name: Install the pinned inputs
        if: inputs.runtime
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          maintenance/bin/takaro-maint install \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            --dest "$RUNNER_TEMP/game"

      - name: Build
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          maintenance/bin/takaro-maint build \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            --version "$IN_VERSION" \
            --out dist \
            --toolchain container

      # Driven by the manifest, not a glob: every artifact the build declared is checked,
      # whatever extension it has.
      - name: The artifacts carry this target's identity
        shell: bash
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          mapfile -t files < <(jq -r '.artifacts[].file' dist/build-manifest.json | sed 's|^|dist/|')
          maintenance/bin/takaro-maint artifact validate \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            "${files[@]}"

      # Build the same commit again from scratch and require identical bytes. Without
      # --rerun-tasks the second build is UP-TO-DATE and proves nothing.
      - name: Build again and require identical bytes
        shell: bash
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          maintenance/bin/takaro-maint build \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            --version "$IN_VERSION" \
            --out dist-again \
            --toolchain container \
            --gradle-args --rerun-tasks
          for file in $(jq -r '.artifacts[].file' dist/build-manifest.json); do
            cmp "dist/$file" "dist-again/$file"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ inputs.connector }}-${{ matrix.target.id }}
          path: dist/

  # Modules that have not moved to the catalog yet keep their old build path.
  legacy:
    if: inputs.legacy_build != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.publish == 'stable' && inputs.tag || github.sha }}
          fetch-tags: true

      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Legacy build script
        env:
          IN_LEGACY_BUILD: ${{ inputs.legacy_build }}
          IN_VERSION: ${{ inputs.version }}
        run: bash "$IN_LEGACY_BUILD" "$IN_VERSION" "$PWD/dist"

      # A legacy script that is still listed must still produce something. Silently
      # uploading nothing is how a release loses a platform's jar without anyone noticing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ inputs.connector }}-legacy
          path: dist/
          if-no-files-found: error

  # Every target really boots in its pinned container and answers the protocol before
  # anything is published. The command is the same one a maintainer runs locally; only the
  # run id, the labels and the budgets differ.
  verify:
    needs: [plan, build]
    if: inputs.runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.publish == 'stable' && inputs.tag || github.sha }}
          fetch-tags: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      - name: Resolve the target
        id: target
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          maintenance/bin/takaro-maint targets resolve \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            --format gha >> "$GITHUB_OUTPUT"

      # The same fingerprint-keyed cache the build leg filled: the pinned server inputs come from it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/takaro-maint
          key: ${{ inputs.connector }}-${{ steps.target.outputs.fp16 }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ inputs.connector }}-${{ matrix.target.id }}
          path: dist

      - name: Boot the target against a local fake Takaro and run every check
        # `shell: bash` is what turns on `-o pipefail`; the implicit shell does not, so the
        # `tee` below would swallow a failing verification and let `publish` run anyway.
        shell: bash
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          mkdir -p reports
          maintenance/bin/takaro-maint verify \
            --game "$IN_CONNECTOR" \
            --target "${{ matrix.target.id }}" \
            --artifacts dist \
            --out reports \
            --run-id "gha-${{ github.run_id }}-${{ github.run_attempt }}" \
            --label "tm.ci=github" \
            --startup-timeout 600 \
            --cleanup-orphans | tee reports/verify.json

      - name: Job summary
        if: always()
        env:
          IN_CONNECTOR: ${{ inputs.connector }}
        run: |
          report="reports/${{ matrix.target.id }}/report.json"
          {
            echo "### verify $IN_CONNECTOR/${{ matrix.target.id }}"
            if [ -f "$report" ]; then
              jq -r '
                "level **\(.level)** · outcome **\(.outcome)** · source `\(.source.revision[0:12])`"
                + " · fingerprint `\(.target.fingerprint[0:16])` · image `\(.runtime.image.digest)`"
                + " · runtime \(.runtime.loader) \(.runtime.loaderVersion) / \(.runtime.gameVersion)"
                + "\n\n| check | status | ms |\n|---|---|---|"
              ' "$report"
              jq -r '.checks[] | "| \(.id) | \(.status) | \(.durationMs) |"' "$report"
            else
              echo "no report was written (the run failed before verification started)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-${{ inputs.connector }}-${{ matrix.target.id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # The harness removes its container in `finally`; this catches a cancelled job.
      - name: Remove anything the run left behind
        if: always()
        run: docker ps -aq --filter "label=tm.run=gha-${{ github.run_id }}-${{ github.run_attempt }}" | xargs -r docker rm -f

  publish:
    needs: [build, legacy, verify]
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && !inputs.runtime))
      && (needs.legacy.result == 'success' || needs.legacy.result == 'skipped')
      && inputs.publish != 'none'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.publish == 'stable' && inputs.tag || github.sha }}
          fetch-tags: true

      # All release/comment operations act as takaro-ci-bot[bot] (not github-actions[bot]).
      # Skipped on fork PRs, which can't access the App secrets and don't publish builds.
      - name: Generate token
        id: app-token
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}

      # No merge-multiple: each target's build-manifest.json and SHA256SUMS have the same
      # name, and merging them collapses four manifests into whichever one landed last.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-${{ inputs.connector }}-*
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.runtime
        with:
          pattern: verify-${{ inputs.connector }}-*
          path: reports

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"

      - run: uv python install
      - run: uv sync --frozen --project maintenance

      # One job assembles and publishes the whole set. Fork PRs get a read-only token, so they
      # can't publish or comment; they build for validation only.
      - name: Assemble, publish and verify the complete set
        if: ${{ inputs.publish == 'stable' || inputs.publish == 'rolling' || (inputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IN_CONNECTOR: ${{ inputs.connector }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          IN_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          # No reports directory when the runtime leg was skipped; the release then carries
          # the compat record alone and claims no runtime verification.
          report_args=()
          if [ -d reports ]; then report_args=(--reports reports); fi
          scripts/publish-release.sh publish \
            --connector "$IN_CONNECTOR" \
            --channel "$IN_PUBLISH" \
            --version "$IN_VERSION" \
            --tag "$IN_TAG" \
            --pr-number "$IN_PR_NUMBER" \
            --dist dist \
            "${report_args[@]}" \
            --out assembled

      - name: Comment PR build
        if: ${{ inputs.publish == 'pr' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IN_CONNECTOR: ${{ inputs.connector }}
          IN_PR_NUMBER: ${{ inputs.pr_number }}
          IN_TAG: ${{ inputs.tag }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          scripts/comment-pr-build.sh "$IN_CONNECTOR" \
            "$IN_PR_NUMBER" \
            "$IN_TAG" \
            "$IN_VERSION" \
            assembled

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-${{ inputs.connector }}
          path: assembled/
          if-no-files-found: ignore
          retention-days: 30
