name: Conan Exiles Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/conan-exiles/**'
      - 'catalog/conan-exiles/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/conan-exiles.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/conan-exiles/**'
      - 'catalog/conan-exiles/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/conan-exiles.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 1.0.2)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. conan-exiles-v1.0.2)
        required: true
        type: string

concurrency:
  group: conan-exiles-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: games/conan-exiles/bridge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources, never on whatever main has become. The job is
          # not gated on `!inputs.tag` -- `release` needs it, and a skipped dependency
          # would skip the release with it.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/conan-exiles/bridge/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The contract check lives here: a real bridge between a fake RCON server and a
      # fake Takaro, so a hosted runner proves the protocol without a 4.3 GB game.
      - name: Test
        run: npm test
      # `check-exact-source.mjs` is the gate between `npm ci` and whatever the lockfile
      # points at; it is not under the bridge's own test glob, so it needs its own step.
      - name: Test the build scripts
        run: npm run test:scripts
      - name: Build
        run: npm run build

  # The native connector library (LD_PRELOAD into the Linux server): unit, drift, fake-Takaro wire
  # and real-library tests, built in the pinned buster toolchain image.
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Build and test the native library
        run: games/conan-exiles/native/build.sh --tests

  # The Windows native connector (winmm.dll proxy), cross-compiled with the zig the Enshrouded
  # release builder pins (same URL and SHA-256). The build checks the vendored MinHook hashes and
  # the DLL's exports, and zeroes the link timestamps so the bytes are reproducible.
  native-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Install the pinned zig 0.13.0
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - name: Build the Windows DLL twice and compare
        shell: bash
        run: |
          games/conan-exiles/native/platform/windows/build.sh
          cp games/conan-exiles/native/dist-windows/winmm.dll "$RUNNER_TEMP/first.dll"
          games/conan-exiles/native/platform/windows/build.sh
          cmp "$RUNNER_TEMP/first.dll" games/conan-exiles/native/dist-windows/winmm.dll

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A release or recovery run builds the tag, never whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh conan-exiles >> "$GITHUB_OUTPUT"

  release:
    needs: [test, native, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: conan-exiles
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The Conan Exiles server is a 4.3 GB Steam depot needing ~10 GB RAM: a hosted
      # runner cannot boot it, so the release claims contract verification (the bridge's
      # own end-to-end tests) and runtime onboarding is tracked separately.
      runtime: false
