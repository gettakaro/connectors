name: Enshrouded Connector

on:
  push:
    branches: [main]
    paths:
      - 'games/enshrouded/**'
      - 'catalog/enshrouded/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/enshrouded.yml'
      - '.github/workflows/connector-release.yml'
  pull_request:
    paths:
      - 'games/enshrouded/**'
      - 'catalog/enshrouded/**'
      - 'maintenance/**'
      - 'scripts/**'
      - '.github/workflows/enshrouded.yml'
      - '.github/workflows/connector-release.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  # Manual re-run to (re)attach assets to an existing release tag, for recovering a
  # release that release-please published without them.
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the built artifact (e.g. 0.4.2)
        required: true
        type: string
      tag:
        description: Existing release tag to upload the assets to (e.g. enshrouded-v0.4.2)
        required: true
        type: string

concurrency:
  group: enshrouded-${{ github.ref }}-${{ inputs.tag || 'ci' }}
  # A push during a release run queues behind it; only ordinary CI runs are cancelled.
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The same commit the release job builds: a recovery run for an older tag is
          # gated on that tag's sources and catalog, never on whatever main has become.
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: games/enshrouded/sidecar/package-lock.json
      - name: Install sidecar dependencies
        working-directory: games/enshrouded/sidecar
        run: npm ci
      - name: Typecheck sidecar
        working-directory: games/enshrouded/sidecar
        run: npm run typecheck
      # The mock-plugin, protocol, actions, events and client suites: what the sidecar does
      # with the plugin's answers, without a game.
      - name: Test sidecar
        working-directory: games/enshrouded/sidecar
        run: npm test
      # The native plugin's host-testable parts, compiled in the pinned gcc image against a
      # small windows.h shim: the log correlator, the admin-protection helpers, the display
      # names, and the direct Takaro connector (sidecar parity fixtures, bridge, outbox,
      # timed bans, persistence, heartbeat).
      - name: Plugin host tests
        run: |
          chmod +x games/enshrouded/mod/tests/run.sh
          games/enshrouded/mod/tests/run.sh

  # The real dbghelp.dll, loaded by a tiny host exe under the pinned Proton image, talks WSS
  # to a fake Takaro: identify, heartbeat, requests, confirm-on-later-pong, reconnect with
  # resend, TLS rejection, token-gated diagnostics. No game runs (game capabilities degrade).
  native-wine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The same pinned zig the release builder installs (Dockerfile.builder).
      - name: Install zig 0.13.0
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - name: Native connector under Wine
        env:
          WORK: ${{ runner.temp }}/native-wine
        run: |
          chmod +x games/enshrouded/mod/build.sh games/enshrouded/mod/tests/wine/run.sh
          games/enshrouded/mod/tests/wine/run.sh
      - name: Keep the Wine test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enshrouded-native-wine-results
          path: ${{ runner.temp }}/native-wine/results
          if-no-files-found: ignore

  params:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.params.outputs.version }}
      tag: ${{ steps.params.outputs.tag }}
      publish: ${{ steps.params.outputs.publish }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release params
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-params.sh enshrouded >> "$GITHUB_OUTPUT"

  release:
    needs: [test, native-wine, params]
    uses: ./.github/workflows/connector-release.yml
    secrets: inherit
    with:
      connector: enshrouded
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
      publish: ${{ needs.params.outputs.publish }}
      pr_number: ${{ github.event.pull_request.number }}
      # The Enshrouded dedicated server is a Windows binary that only runs under Proton in
      # its pinned image, on top of an 8.8 GB Steam depot set. A hosted runner cannot
      # install and boot that here, so the release claims contract verification only;
      # runtime verification is proven locally by `takaro-maint verify --game enshrouded`
      # and its CI onboarding is tracked separately.
      runtime: false
