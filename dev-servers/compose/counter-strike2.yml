---
name: takaro-dev-counter-strike2

services:
  cs2:
    image: cm2network/steamcmd:root
    container_name: takaro-dev-counter-strike2
    init: true
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /cs2
    entrypoint: ["/cs2/cs2"]
    command:
      - -dedicated
      - -insecure
      - -usercon
      - -port
      - "27035"
      - -maxplayers_override
      - "8"
      - +sv_lan
      - "1"
      - +sv_hibernate_when_empty
      - "0"
      - +hostname
      - Takaro Dev Counter-Strike 2
      - +game_type
      - "0"
      - +game_mode
      - "0"
      - +map
      - de_dust2
    environment:
      HOME: /home/steam
      SteamAppId: "730"
      LD_LIBRARY_PATH: /cs2/game/csgo/bin/linuxsteamrt64:/cs2/game/bin/linuxsteamrt64
    ports:
      - "27035:27035/udp"
    volumes:
      - /srv/servers/takaro-dev/cs2:/cs2
    stop_grace_period: 30s
    restart: unless-stopped
