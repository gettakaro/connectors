---
name: takaro-dev-conan-exiles

services:
  conan-exiles:
    # Resolved from the catalog into _data/.targets/conan-exiles.env by install.sh. The
    # pinned server is a self-contained UE5 Linux build that needs only the base image's
    # glibc and libstdc++, so it runs in the catalog's pinned runtime image and is started
    # by the launcher the depot ships. The native connector is not preloaded here; see
    # games/conan-exiles/DEVELOPMENT.md. No Steam client, no updater: the bytes are the
    # ledger's, written once by `takaro-maint install`.
    image: "${CONAN_EXILES_IMAGE:-target-not-resolved}"
    container_name: takaro-dev-conan-exiles
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    entrypoint: ["/bin/bash", "/takaro/entrypoint.sh"]
    ports:
      # Shifted off Conan's 7777/7778 defaults so no row in the dev-servers
      # port map is ambiguous next to Terraria's 7777/tcp.
      - "7787:7777/udp"
      - "7788:7778/udp"
      - "27015:27015/udp"
      - "127.0.0.1:25580:25575"
    environment:
      HOME: /conan/.takaro/home
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in dev-servers/.env}"
      CONAN_GAME_PORT: "7777"
      CONAN_QUERY_PORT: "27015"
      CONAN_RCON_PORT: "25575"
    volumes:
      - ../_data/conan-exiles/server:/conan
      # Bind-mounted rather than baked: the image is the catalog's, not ours.
      - ../images/conan-exiles/entrypoint.sh:/takaro/entrypoint.sh:ro
    restart: unless-stopped
