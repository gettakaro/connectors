---
name: takaro-dev-enshrouded

services:
  # The exact server build the Takaro plugin's signatures were derived on.
  #
  # ENSHROUDED_IMAGE comes from _data/.targets/enshrouded.env once the rig resolves the
  # catalog target; the default below is that same image:tag@digest, so this file is pinned
  # either way and a test asserts the two agree. Nothing here schedules an update:
  # ../../games/enshrouded/server/enshrouded-updater replaces the image's updater program,
  # which would otherwise compare the installed build with the branch head at every start
  # and run `steamcmd +app_update` over the install. No UPDATE_CRON, no RESTART_CRON, no
  # GAME_BRANCH, no STEAMCMD_ARGS.
  #
  # The game files under _data/enshrouded/server are installed by
  #   takaro-maint install --game enshrouded --dest dev-servers/_data/enshrouded/server
  # and the plugin is placed under _data/enshrouded/server/takaro/plugin/ by
  # `takaro-maint deploy`. The plugin holds the Takaro connection itself: there is no
  # second container.
  enshrouded:
    image: "${ENSHROUDED_IMAGE:-mornedhels/enshrouded-server:1.7.2-proton@sha256:85978a10f88a85ab0a0aa92e9821d30424895d38bf81fe543532451219c42d0d}"
    container_name: takaro-dev-enshrouded
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "15637:15637/udp"
    environment:
      SERVER_NAME: Takaro Dev Enshrouded
      SERVER_SLOT_COUNT: "16"
      PUID: "${DEV_UID:-1000}"
      PGID: "${DEV_GID:-1000}"
      SERVER_ROLE_0_NAME: Admins
      SERVER_ROLE_0_PASSWORD: "${ENSHROUDED_ADMIN_PASSWORD:?required}"
      SERVER_ROLE_0_CAN_KICK_BAN: "true"
      SERVER_ROLE_0_CAN_ACCESS_INVENTORIES: "true"
      SERVER_ROLE_0_CAN_EDIT_WORLD: "true"
      SERVER_ROLE_0_CAN_EDIT_BASE: "true"
      SERVER_ROLE_0_CAN_EXTEND_BASE: "true"
      SERVER_ROLE_1_NAME: Friends
      SERVER_ROLE_1_PASSWORD: "${ENSHROUDED_PLAYER_PASSWORD:?required}"
      SERVER_ROLE_1_CAN_ACCESS_INVENTORIES: "true"
      SERVER_ROLE_1_CAN_EDIT_WORLD: "true"
      SERVER_ROLE_1_CAN_EDIT_BASE: "true"
      SERVER_ROLE_1_CAN_EXTEND_BASE: "true"
      SERVER_ROLE_2_NAME: Guests
      SERVER_ROLE_2_PASSWORD: "${ENSHROUDED_GUEST_PASSWORD:?required}"
      BACKUP_CRON: "0 * * * *"
      BACKUP_MAX_COUNT: "24"
      TZ: "${TZ:-Etc/UTC}"
      WINEDLLOVERRIDES: "dbghelp=n,b"
      # The native connector in dbghelp.dll. Environment wins over takaro/plugin.json.
      TAKARO_WS_URL: "${TAKARO_WS_URL:-wss://connect.takaro.io/}"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_ENSHROUDED:-takaro-dev-enshrouded}"
      TAKARO_REGISTRATION_TOKEN: "${TAKARO_REGISTRATION_TOKEN:?required}"
      TAKARO_SERVER_NAME: "Takaro Dev Enshrouded"
      ENSHROUDED_LOG_TAIL: "auto"
      ENSHROUDED_LOG_EVENTS: "${ENSHROUDED_LOG_EVENTS:-filtered}"
      # Diagnostics only: the bearer secret for 127.0.0.1:18890/health inside the container.
      TAKARO_PLUGIN_TOKEN: "${TAKARO_ENSHROUDED_PLUGIN_TOKEN:?required}"
      # Rollback to the 0.5.0 plugin + sidecar pair only (games/enshrouded/INSTALL.md):
      # 1/1 turns the native connection off and serves the legacy HTTP routes again.
      TAKARO_NATIVE_DISABLE: "${ENSHROUDED_NATIVE_DISABLE:-0}"
      TAKARO_LEGACY_HTTP: "${ENSHROUDED_LEGACY_HTTP:-0}"
    volumes:
      # Both binds refuse to be created: `create_host_path: false` makes compose stop with
      # "bind source path does not exist" instead of laying down an empty tree and a
      # DIRECTORY named dbghelp.dll -- a rig that boots with the plugin silently absent.
      # The install is `takaro-maint install --game enshrouded --dest
      # dev-servers/_data/enshrouded/server` and the plugin is `takaro-maint deploy`; there
      # is no `dev-servers/scripts/install.sh enshrouded` dispatch yet.
      - type: bind
        source: ../_data/enshrouded/server
        target: /opt/enshrouded/server
        bind:
          create_host_path: false
      # Takaro plugin (dbghelp.dll proxy), placed by `takaro-maint deploy` and mounted
      # read-only so nothing inside the container can replace it.
      - type: bind
        source: ../_data/enshrouded/server/takaro/plugin/dbghelp.dll
        target: /opt/enshrouded/server/dbghelp.dll
        read_only: true
        bind:
          create_host_path: false
      # No boot of this rig ever runs SteamCMD.
      - ../../games/enshrouded/server/enshrouded-updater:/usr/local/etc/enshrouded/enshrouded-updater:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
