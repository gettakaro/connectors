# VEIN — TAKARO DEV RIG (disposable).
#
# Steam app 2131400, Linux native dedicated server, launched as
#   Vein/Binaries/Linux/VeinServer-Linux-Test -Port=7777 -QueryPort=27015 -log
# Readiness: game HTTP /status and Steam heartbeat in Vein.log.
#
# Host ports: game 7807 (udp+tcp), Steam query 27017/udp.
# The built-in HTTP API (8080) and optional native diagnostics (18890)
# stay inside the container network namespace and are never published.
name: takaro-dev-vein
services:
  vein:
    build: ../images/vein
    image: takaro-dev-vein:latest
    container_name: takaro-dev-vein
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "7807:7777/udp"
      - "7807:7777/tcp"
      - "27017:27015/udp"
    environment:
      TZ: Europe/Brussels
      VEIN_SERVER_NAME: "Takaro Dev Vein"
      VEIN_SERVER_DESCRIPTION: "Takaro connector development rig"
      VEIN_MAXPLAYERS: "8"
      # false: the rig must NOT appear on Ramjet's public server list. Direct
      # connect still works.
      VEIN_PUBLIC: "false"
      # LAN test join password (short on purpose); admin creds stay strong.
      VEIN_SERVER_PASSWORD: "${VEIN_DEV_WORLD_PASSWORD:?required}"
      VEIN_ADMIN_STEAMIDS: "${VEIN_DEV_ADMIN_STEAMIDS:-}"
      VEIN_HTTP_PORT: "8080"
      VEIN_PORT: "7777"
      VEIN_QUERY_PORT: "27015"
      # Version-locked on purpose: the client on the gamer PC must match the
      # server build id, so the rig never updates itself behind our back.
      VEIN_AUTO_UPDATE: "false"
      TAKARO_PLUGIN_TOKEN: "${TAKARO_VEIN_PLUGIN_TOKEN:?required}"
      TAKARO_PLUGIN_PORT: "${TAKARO_PLUGIN_PORT:-18890}"
      TAKARO_WS_URL: "${TAKARO_WS_URL:-wss://connect.takaro.io/}"
      TAKARO_RECONNECT_BASE_MS: "${TAKARO_RECONNECT_BASE_MS:-2000}"
      TAKARO_RECONNECT_MAX_MS: "${TAKARO_RECONNECT_MAX_MS:-60000}"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_VEIN:-takaro-dev-vein}"
      TAKARO_REGISTRATION_TOKEN: "${TAKARO_REGISTRATION_TOKEN:?required}"
      TAKARO_SERVER_NAME: "${TAKARO_SERVER_NAME:-Takaro Dev Vein}"
      TAKARO_SENDER_NAME: "${TAKARO_SENDER_NAME:-}"
      TAKARO_SERVER_CHAT_NAME: "${TAKARO_SERVER_CHAT_NAME:-}"
      # Keep existing game-enforcement bans.json under the mounted game data.
      TAKARO_PLUGIN_DATA_DIR: "${TAKARO_PLUGIN_DATA_DIR:-/home/steam/vein/Vein/Binaries/Linux/takaro}"
      # The legacy sidecar wrote these files at its /data root. An explicit
      # path preserves them during upgrade; clean installs use connector-state.
      TAKARO_STATE_DIR: "${TAKARO_STATE_DIR:-/opt/takaro-state}"
      TAKARO_CURSOR_FILE: "${TAKARO_CURSOR_FILE:-}"
      TAKARO_ONLINE_FILE: "${TAKARO_ONLINE_FILE:-}"
      TAKARO_BAN_FILE: "${TAKARO_BAN_FILE:-}"
      TAKARO_KNOWN_PLAYERS_FILE: "${TAKARO_KNOWN_PLAYERS_FILE:-}"
      VEIN_LOG_FILE: "${VEIN_LOG_FILE:-/home/steam/vein/Vein/Saved/Logs/Vein.log}"
      VEIN_HTTP_API: "${VEIN_HTTP_API-http://127.0.0.1:8080}"
      VEIN_LOG_TAIL: "${VEIN_LOG_TAIL:-auto}"
      VEIN_LOG_EVENTS: "${VEIN_LOG_EVENTS:-filtered}"
      VEIN_LOG_LOGIN_RE: "${VEIN_LOG_LOGIN_RE:-}"
      VEIN_LOG_JOIN_RE: "${VEIN_LOG_JOIN_RE:-}"
      VEIN_LOG_LEAVE_RE: "${VEIN_LOG_LEAVE_RE:-}"
      VEIN_LOG_CHAT_RE: "${VEIN_LOG_CHAT_RE:-}"
      VEIN_LOG_READY_RE: "${VEIN_LOG_READY_RE:-}"
      # Consumed by the entrypoint: LD_PRELOAD on the game binary only, and only
      # when the file exists and is non-empty (an empty preload breaks ld.so).
      TAKARO_PLUGIN_SO: /opt/takaro/libtakaro-vein.so
      # Lane L3b: the plugin grants these SteamID64s admin through
      # AVeinGameSession::SetAdmin (VEIN's AdminSteamIDs is NOT a config property,
      # so VEIN_ADMIN_STEAMIDS above can never open the in-game admin panel).
      TAKARO_ADMIN_STEAMIDS: "${VEIN_DEV_ADMIN_STEAMIDS:-}"
      TAKARO_SUPERADMIN_STEAMIDS: "${TAKARO_SUPERADMIN_STEAMIDS:-}"
      TAKARO_PLUGIN_DEBUG: "1"
      TAKARO_SYM_PATH: "${TAKARO_SYM_PATH:-}"
      TAKARO_ITEM_NAMES: "${TAKARO_ITEM_NAMES:-0}"
      TAKARO_BROADCAST_VIA: "${TAKARO_BROADCAST_VIA:-auto}"
      TAKARO_CA_FILE: "${TAKARO_CA_FILE:-}"
    volumes:
      - ../_data/vein-dev:/home/steam/vein
      # The DIRECTORY is mounted read-only (not the .so itself) so compose still
      # starts before the plugin exists, and so SteamCMD can never touch it.
      - ../_data/vein-plugin:/opt/takaro:ro
      - ../_data/vein-sidecar:/opt/takaro-state
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
