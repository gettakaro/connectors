---
name: takaro-dev-minecraft

x-minecraft-common: &minecraft-common
  image: itzg/minecraft-server:java21
  restart: unless-stopped
  tty: true
  stdin_open: true
  environment: &minecraft-env
    EULA: "TRUE"
    VERSION: "${MINECRAFT_VERSION:-1.21.11}"  # paper/neoforge only; fabric overrides it
    MEMORY: "${MINECRAFT_MEMORY:-2G}"
    ENABLE_RCON: "true"
    RCON_PORT: "25575"
    ONLINE_MODE: "false"
    RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in dev-servers/.env}"
    TAKARO_WS_URL: "${TAKARO_WS_URL:-wss://connect.takaro.io/}"
    TAKARO_REGISTRATION_TOKEN: "${TAKARO_REGISTRATION_TOKEN:-}"
    TAKARO_DEBUG: "${TAKARO_DEBUG:-false}"

services:
  # TODO(#151): switch to ${MC_PAPER_*} once Paper becomes a catalog target.
  paper:
    <<: *minecraft-common
    profiles: ["paper"]
    container_name: takaro-dev-minecraft-paper
    ports:
      - "25565:25565/tcp"
      - "127.0.0.1:25575:25575"
    environment:
      <<: *minecraft-env
      TYPE: "PAPER"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_PAPER:-takaro-dev-paper}"
    volumes:
      - ../_data/minecraft/paper:/data

  # TODO(#151): switch to ${MC_NEOFORGE_*} once NeoForge becomes a catalog target.
  neoforge:
    <<: *minecraft-common
    profiles: ["neoforge"]
    container_name: takaro-dev-minecraft-neoforge
    ports:
      - "25566:25565/tcp"
      - "127.0.0.1:25576:25575"
    environment:
      <<: *minecraft-env
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "beta"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_NEOFORGE:-takaro-dev-neoforge}"
    volumes:
      - ../_data/minecraft/neoforge:/data

  # Fully driven by the catalog target: image, game version, loader and launcher all
  # come from _data/.targets/minecraft-fabric.env, which install.sh resolves.
  # The sentinel keeps `compose config` valid before the first install; the real gate
  # is ds_preflight_target in start.sh.
  fabric:
    <<: *minecraft-common
    image: "${MC_FABRIC_IMAGE:-target-not-resolved}"
    profiles: ["fabric"]
    container_name: takaro-dev-minecraft-fabric
    ports:
      - "25567:25565/tcp"
      - "127.0.0.1:25577:25575"
    environment:
      <<: *minecraft-env
      TYPE: "FABRIC"
      VERSION: "${MC_FABRIC_VERSION:-}"
      FABRIC_LOADER_VERSION: "${MC_FABRIC_LOADER_VERSION:-}"
      FABRIC_LAUNCHER_VERSION: "${MC_FABRIC_LAUNCHER_VERSION:-}"
      FABRIC_LAUNCHER: "${MC_FABRIC_LAUNCHER:-}"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_FABRIC:-takaro-dev-fabric}"
    volumes:
      - ../_data/minecraft/fabric:/data

# --- additional targets are appended below ---

  # Second Fabric target (catalog fabric-26.1.2): the same shape as `fabric`, with its own
  # data dir, identity and ports. Values come from _data/.targets/minecraft-fabric-26.1.2.env.
  fabric-26-1-2:
    <<: *minecraft-common
    image: "${MC_FABRIC_26_1_2_IMAGE:-target-not-resolved}"
    profiles: ["fabric-26-1-2"]
    container_name: takaro-dev-minecraft-fabric-26.1.2
    ports:
      - "25568:25565/tcp"
      - "127.0.0.1:25578:25575"
    environment:
      <<: *minecraft-env
      TYPE: "FABRIC"
      VERSION: "${MC_FABRIC_26_1_2_VERSION:-}"
      FABRIC_LOADER_VERSION: "${MC_FABRIC_26_1_2_LOADER_VERSION:-}"
      FABRIC_LAUNCHER_VERSION: "${MC_FABRIC_26_1_2_LAUNCHER_VERSION:-}"
      FABRIC_LAUNCHER: "${MC_FABRIC_26_1_2_LAUNCHER:-}"
      TAKARO_IDENTITY_TOKEN: "${TAKARO_IDENTITY_FABRIC_26_1_2:-takaro-dev-fabric-26.1.2}"
    volumes:
      - ../_data/minecraft/fabric-26.1.2:/data
