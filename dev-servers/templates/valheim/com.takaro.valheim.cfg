## Rendered by dev-servers/scripts/install.sh into
## _data/valheim/config/bepinex/config/com.takaro.valheim.cfg
## The Valheim connector is BepInEx-config only; it has no env-var support.

[Takaro]

## Takaro registration token.
registrationToken = ${TAKARO_REGISTRATION_TOKEN}

## Human-readable server name.
serverName = ${SERVER_NAME}

## Takaro identity token after first registration.
identityToken = ${IDENTITY_TOKEN}

## Takaro connector WebSocket URL.
takaroWsUrl = ${TAKARO_WS_URL}

## Connector log level.
logLevel = ${LOG_LEVEL}

## Forward connector log events to Takaro.
enableLogEvents = true

## Semicolon-separated exact console commands allowed for executeConsoleCommand.
commandAllowlistExact = help

## Semicolon-separated console command prefixes allowed for executeConsoleCommand.
commandAllowlistPrefixes =

## Name shown in game chat for Takaro messages (unless Takaro sends its own sender name).
chatSenderName = ${CHAT_SENDER_NAME}
